                if (code <= 48) return <Icon name="Cloud" className="w-8 h-8 text-stone-600" />;
                if (code <= 67) return <Icon name="CloudRain" className="w-8 h-8 text-stone-600" />;
                return <Icon name="CloudSun" className="w-8 h-8 text-stone-600" />;
            };

            const getWeatherDesc = (code) => {
                if (code === undefined) return "晴朗";
                if (code <= 1) return "晴";
                if (code <= 3) return "多雲";
                if (code <= 48) return "陰";
                if (code <= 67) return "雨";
                return "變天";
            };

            const handleEventClick = (event) => {
                setSelectedEvent(event);
            };

            const closeModal = () => {
                setSelectedEvent(null);
            };

            const ScheduleView = () => (
                <>
                <div className="bg-[#FCFAF2] border-b border-stone-200 sticky top-0 z-20 overflow-x-auto whitespace-nowrap scrollbar-hide py-3">
                    <div className="flex px-4 space-x-3">
                    {schedule.map((day, index) => (
                        <button
                        key={index}
                        onClick={() => setActiveDay(index)}
                        className={`flex-shrink-0 px-4 py-2 rounded transition-all duration-300 ${
                            activeDay === index
                            ? 'bg-[#981913] text-white shadow-md'
                            : 'bg-white text-stone-500 border border-stone-200 hover:border-stone-400'
                        }`}
                        >
                        <div className="text-[10px] uppercase tracking-wider opacity-70 mb-0.5">{day.day}</div>
                        <div className="text-sm font-medium">{day.date}</div>
                        </button>
                    ))}
                    </div>
                </div>

                <main className="p-4 max-w-md mx-auto pb-24">
                    <div className="bg-white rounded-lg p-5 mb-8 border border-stone-200 shadow-[0_2px_8px_rgba(0,0,0,0.04)] flex items-center justify-between">
                    <div>
                        <div className="flex items-center text-xs text-stone-400 uppercase tracking-widest mb-2">
                        <Icon name="MapPin" size={10} className="mr-1" />
                        Tokyo Live Weather
                        </div>
                        <div className="flex items-baseline">
                        <div className="text-4xl font-light text-stone-800">
                            {currentWeather ? `${Math.round(currentWeather.temperature_2m)}` : "--"}
                        </div>
                        <span className="text-xl font-light text-stone-400 ml-1">°C</span>
                        </div>
                        <div className="text-sm mt-1 text-stone-500 font-medium">
                        {currentWeather ? getWeatherDesc(currentWeather.weather_code) : "讀取中..."}
                        </div>
                    </div>
                    <div className="bg-stone-50 p-3 rounded-full border border-stone-100">
                        {getWeatherIcon(currentWeather?.weather_code)}
                    </div>
                    </div>

                    <div className="mb-8 pl-1">
                    <h2 className="text-2xl font-serif font-bold text-stone-800 mb-1">{schedule[activeDay].title}</h2>
                    <p className="text-stone-400 text-xs font-light tracking-wide">點擊卡片查看詳細內容</p>
                    </div>

                    <div className="relative border-l border-stone-200 ml-3 space-y-8">
                    {schedule[activeDay].events.map((event, idx) => (
                        <div key={idx} className="relative pl-6 group">
                        <div className={`absolute -left-[5px] top-2 w-[9px] h-[9px] rounded-full border border-white ring-1 transition-all duration-300 z-10 ${
                            selectedEvent === event ? 'bg-[#981913] ring-[#981913]' : 'bg-stone-300 ring-stone-300 group-hover:bg-stone-400 group-hover:ring-stone-400'
                        }`}></div>

                        {event.transit && (
                            <div className="mb-2 ml-1 flex items-start text-xs text-stone-500">
                            <div className="mt-0.5 mr-2 text-stone-300">
                                <Icon name="ArrowDown" size={12} />
                            </div>
                            <div className="bg-stone-50 px-3 py-2 rounded text-stone-600 border border-stone-100 w-full">
                                <div className="flex items-center mb-1 font-medium text-stone-700">
                                {event.transit.type === 'walk' ? <Icon name="Footprints" size={12} className="mr-1.5" /> : <Icon name="Train" size={12} className="mr-1.5" />}
                                {event.transit.text}
                                </div>
                                <span className="text-stone-400 pl-4 block">約 {event.transit.duration}</span>
                            </div>
                            </div>
                        )}

                        <div 
                            className="bg-white p-4 rounded-lg border border-stone-100 shadow-sm active:scale-[0.98] transition-all cursor-pointer hover:border-stone-300"
                            onClick={() => handleEventClick(event)}
                        >
                            <div className="flex items-center text-xs font-bold text-stone-400 mb-2 tracking-wide">
                            {event.time}
                            </div>
                            
                            <h3 className="text-lg font-bold text-stone-800 mb-1 leading-snug">{event.title}</h3>
                            
                            <div className="flex items-center text-stone-500 text-sm mb-1">
                            <Icon name="MapPin" size={12} className="mr-1.5 flex-shrink-0 opacity-60" />
                            <span className="line-clamp-1">{event.location}</span>
                            </div>

                            <div className="absolute right-4 top-1/2 transform -translate-y-1/2 text-stone-200">
                            <Icon name="ChevronRight" size={18} />
                            </div>
                        </div>
                        </div>
                    ))}
                    </div>
                </main>
                </>
            );

            return (
                <div className="min-h-screen bg-[#FCFAF2] font-sans text-stone-800 flex flex-col">
                <header className="bg-[#981913] text-white sticky top-0 z-30 shadow-md h-[60px] flex items-center justify-between px-4">
                    <div className="flex items-center">
                    <div className="w-8 h-8 bg-white/20 rounded-full flex items-center justify-center mr-3 overflow-hidden">
                        {/* 這裡請替換成您自己的 Logo */}
                        <img src="images/logo.png" alt="Logo" className="w-full h-full object-cover opacity-100" />
                    </div>
                    <h1 className="text-lg font-serif font-bold tracking-wider">東京名校文化探索計劃</h1>
                    </div>
                    <div className="text-xs font-mono opacity-80 hidden sm:block">
                    2026.01.26 - 02.01
                    </div>
                </header>

                <div className="flex-1 overflow-y-auto">
                    {activeTab === 'overview' && <OverviewView />}
                    {activeTab === 'schedule' && <ScheduleView />}
                    {activeTab === 'emergency' && <EmergencyView playAudio={playAudio} />}
                    {activeTab === 'packing' && <PackingView checkedItems={checkedItems} toggleItem={toggleItem} />}
                </div>

                <div className="fixed bottom-0 left-0 right-0 bg-[#981913] border-t border-red-900 flex justify-around items-center h-[80px] pb-5 z-40 shadow-[0_-5px_20px_rgba(0,0,0,0.1)]">
                    <button 
                    onClick={() => setActiveTab('overview')}
                    className={`flex flex-col items-center justify-center w-full h-full transition-all ${activeTab === 'overview' ? 'text-white' : 'text-white/50 hover:text-white/80'}`}
                    >
                    <Icon name="Globe" size={22} strokeWidth={activeTab === 'overview' ? 2.5 : 2} className="mb-1" />
                    <span className="text-[10px] font-medium tracking-widest">總覽</span>
                    </button>
                    <button 
                    onClick={() => setActiveTab('schedule')}
                    className={`flex flex-col items-center justify-center w-full h-full transition-all ${activeTab === 'schedule' ? 'text-white' : 'text-white/50 hover:text-white/80'}`}
                    >
                    <Icon name="Home" size={22} strokeWidth={activeTab === 'schedule' ? 2.5 : 2} className="mb-1" />
                    <span className="text-[10px] font-medium tracking-widest">行程</span>
                    </button>
                    <button 
                    onClick={() => setActiveTab('packing')}
                    className={`flex flex-col items-center justify-center w-full h-full transition-all ${activeTab === 'packing' ? 'text-white' : 'text-white/50 hover:text-white/80'}`}
                    >
                    <Icon name="ListChecks" size={22} strokeWidth={activeTab === 'packing' ? 2.5 : 2} className="mb-1" />
                    <span className="text-[10px] font-medium tracking-widest">清單</span>
                    </button>
                    <button 
                    onClick={() => setActiveTab('emergency')}
                    className={`flex flex-col items-center justify-center w-full h-full transition-all ${activeTab === 'emergency' ? 'text-white' : 'text-white/50 hover:text-white/80'}`}
                    >
                    <Icon name="AlertTriangle" size={22} strokeWidth={activeTab === 'emergency' ? 2.5 : 2} className="mb-1" />
                    <span className="text-[10px] font-medium tracking-widest">求助</span>
                    </button>
                </div>

                {selectedEvent && (
                    <div className="fixed inset-0 z-50 flex items-center justify-center bg-stone-900/40 backdrop-blur-[2px] p-0 sm:p-4 animate-fade-in" onClick={closeModal}>
                    <div 
                        className="bg-[#FCFAF2] w-11/12 max-w-md sm:rounded-2xl rounded-xl overflow-hidden shadow-2xl relative animate-modal-enter flex flex-col max-h-[85vh]"
                        onClick={(e) => e.stopPropagation()}
                    >
                        <div className="relative h-48 sm:h-56 bg-stone-200">
                        {selectedEvent.image ? (
                            <img 
                            src={selectedEvent.image} 
                            alt={selectedEvent.title}
                            className="w-full h-full object-cover"
                            />
                        ) : (
                            <div className="w-full h-full flex items-center justify-center text-stone-400">
                            <Icon name="Camera" size={48} />
                            </div>
                        )}
                        <div className="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent" />
                        
                        <button 
                            onClick={closeModal}
                            className="absolute top-4 right-4 text-white/80 hover:text-white bg-black/20 backdrop-blur-md rounded-full p-2 transition-colors z-10"
                        >
                            <Icon name="X" size={20} />
                        </button>

                        <div className="absolute bottom-4 left-6 text-white">
                            <div className="font-bold text-xs tracking-wider mb-1 opacity-80">{selectedEvent.time}</div>
                            <h2 className="text-2xl font-serif font-bold leading-tight">{selectedEvent.title}</h2>
                            <div className="flex items-center text-stone-200 text-sm mt-1">
                            <Icon name="MapPin" size={14} className="mr-1" />
                            {selectedEvent.location}
                            </div>
                        </div>
                        </div>

                        <div className="p-6 overflow-y-auto custom-scrollbar bg-[#FCFAF2]">
                        <div className="mb-8">
                            <div className="flex items-center text-stone-800 font-bold mb-4 text-sm tracking-widest uppercase border-l-2 border-stone-800 pl-3">
                            About
                            </div>
                            <p className="text-stone-600 leading-relaxed text-sm whitespace-pre-line font-light">
                            {selectedEvent.desc}
                            </p>
                        </div>

                        {selectedEvent.eat && (
                            <div className="mb-6">
                            <div className="flex items-center text-stone-800 font-bold mb-3 text-sm tracking-widest uppercase border-l-2 border-[#D97706] pl-3">
                                Must Eat
                            </div>
                            <div className="bg-white p-4 rounded border border-stone-100 text-stone-600 text-sm">
                                {selectedEvent.eat}
                            </div>
                            </div>
                        )}

                        {selectedEvent.buy && (
                            <div className="mb-8">
                            <div className="flex items-center text-stone-800 font-bold mb-3 text-sm tracking-widest uppercase border-l-2 border-[#BE123C] pl-3">
                                Must Buy
                            </div>
                            <div className="bg-white p-4 rounded border border-stone-100 text-stone-600 text-sm">
                                {selectedEvent.buy}
                            </div>
                            </div>
                        )}

                        {selectedEvent.map && (
                            <a 
                            href={selectedEvent.map} 
                            target="_blank" 
                            rel="noopener noreferrer"
                            className="block w-full bg-stone-800 text-stone-50 text-center py-4 rounded font-medium hover:bg-stone-700 active:scale-[0.99] transition-all flex items-center justify-center shadow-lg shadow-stone-200"
                            >
                            <Icon name="Navigation" size={18} className="mr-2" />
                            Open Maps
                            </a>
                        )}
                        </div>
                    </div>
                    </div>
                )}
                
                <style>{`
                    .scrollbar-hide::-webkit-scrollbar {
                        display: none;
                    }
                    .scrollbar-hide {
                        -ms-overflow-style: none;
                        scrollbar-width: none;
                    }
                    .custom-scrollbar::-webkit-scrollbar {
                        width: 4px;
                    }
                    .custom-scrollbar::-webkit-scrollbar-track {
                        background: transparent; 
                    }
                    .custom-scrollbar::-webkit-scrollbar-thumb {
                        background: #d6d3d1; 
                        border-radius: 4px;
                    }
                    .pb-safe {
                        padding-bottom: env(safe-area-inset-bottom, 20px);
                    }
                    /* Modal Animation: Fade In + Slight Scale Up */
                    @keyframes modal-enter {
                        from { opacity: 0; transform: scale(0.95); }
                        to { opacity: 1; transform: scale(1); }
                    }
                    .animate-modal-enter {
                        animation: modal-enter 0.2s ease-out forwards;
                    }
                    @keyframes slide-up {
                        from { transform: translateY(100%); }
                        to { transform: translateY(0); }
                    }
                    .animate-slide-up {
                        animation: slide-up 0.4s cubic-bezier(0.16, 1, 0.3, 1);
                    }
                    @keyframes fade-in {
                        from { opacity: 0; }
                        to { opacity: 1; }
                    }
                    .animate-fade-in {
                        animation: fade-in 0.3s ease-out;
                    }
                `}</style>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<ScheduleApp />);
    </script>
</body>
</html>
